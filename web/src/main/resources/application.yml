server:
  servlet:
    session:
      # Cookie only. Without this Tomcat falls back to rewriting URLs with
      # ;jsessionid= for the first request of a session, which puts the session
      # identifier into browser history, logs and Referer headers.
      tracking-modes: cookie
      # How long a signed-in console stays signed in while nobody uses it. A
      # detail page following a running job keeps its session alive until the
      # job finishes — see ADR-011.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # Not sent on a cross-site POST, which is a second line behind the CSRF
        # token rather than a replacement for it.
        same-site: lax
        # Off by default because this application does not speak TLS itself.
        # Behind a TLS-terminating proxy, turn it on.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: database-backup-utility

  # Optional deployment-wide transport for EMAIL notification channels.
  # Recipients remain per channel; an empty host leaves only Email unavailable.
  mail:
    host: ${DBBACKUP_SMTP_HOST:}
    port: ${DBBACKUP_SMTP_PORT:587}
    username: ${DBBACKUP_SMTP_USERNAME:}
    password: ${DBBACKUP_SMTP_PASSWORD:}
    from: ${DBBACKUP_SMTP_FROM:dbbackup@localhost}
    properties:
      "mail.smtp.auth": ${DBBACKUP_SMTP_AUTH:true}
      "mail.smtp.starttls.enable": ${DBBACKUP_SMTP_STARTTLS:true}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000

  # PostgreSQL is where this tool keeps its own metadata. That datasource is
  # not automatically a backup target: targets are registered separately with
  # their own credentials — see docs/architecture/overview.md.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbbackup}
    username: ${DB_USERNAME:dbbackup}
    password: ${DB_PASSWORD:dbbackup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the mapping still
      # matches it, and refuses to start when a migration is missing.
      ddl-auto: validate

  quartz:
    # backup_schedules is the source of truth. Quartz stays paused until the
    # ApplicationReady reconciliation has rebuilt every in-memory trigger.
    auto-startup: false
    properties:
      org.quartz.scheduler.instanceName: dbbackup-scheduler
      org.quartz.threadPool.threadCount: 1
      org.quartz.threadPool.threadNamePrefix: dbbackup-scheduler-

management:
  health:
    # Notifications are optional; delivery problems belong on Send test and in
    # the application log, not in the container's liveness result.
    mail:
      enabled: false
  endpoints:
    web:
      # The healthcheck's endpoint and nothing else. It is reachable without
      # signing in, so it says UP or DOWN and never why.
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Kubernetes' liveness and readiness groups, on by default in Boot 4.
      # Nothing here runs on Kubernetes, and each group is one more public URL.
      probes:
        enabled: false

dbbackup:
  operator:
    # The one account that can sign in to the console — see ADR-011.
    username: ${OPERATOR_USERNAME:admin}
    # A bcrypt hash, never the password itself:
    #   docker run --rm -it httpd:2.4-alpine htpasswd -nBC 12 ""
    # (drop the leading colon). No default, for the same reason as the
    # encryption key below: starting without one must fail loudly.
    password-hash: ${OPERATOR_PASSWORD_HASH:}

  mysql:
    # The tool drives the MySQL client binaries directly. A wrong path here
    # stops startup rather than surfacing later as a puzzling connection
    # failure.
    client-path: ${MYSQL_CLIENT_PATH:/usr/bin/mysql}
    dump-path: ${MYSQLDUMP_PATH:/usr/bin/mysqldump}
    # Passed to the clients as --connect-timeout, so an unreachable host fails
    # in seconds instead of holding the request open.
    connect-timeout: 10s

  mariadb:
    # MariaDB has its own client pair. Do not point these at mysql/mysqldump:
    # the dump formats and accepted options have diverged.
    client-path: ${MARIADB_CLIENT_PATH:/usr/bin/mariadb}
    dump-path: ${MARIADB_DUMP_PATH:/usr/bin/mariadb-dump}
    connect-timeout: 10s

  postgresql:
    # PostgreSQL is also the metadata store, but these binaries are only for
    # PostgreSQL targets explicitly registered in the console.
    psql-path: ${PSQL_PATH:/usr/bin/psql}
    dump-path: ${PG_DUMP_PATH:/usr/bin/pg_dump}
    restore-path: ${PG_RESTORE_PATH:/usr/bin/pg_restore}
    connect-timeout: 10s

  mongodb:
    # Both operations come from MongoDB Database Tools. The dump binary also
    # performs the lightweight connection probe, so no shell or driver is
    # needed solely for Test.
    dump-path: ${MONGODUMP_PATH:/usr/bin/mongodump}
    restore-path: ${MONGORESTORE_PATH:/usr/bin/mongorestore}
    connect-timeout: 10s

  sqlite:
    # SQLite targets are files already mounted below this root. The stored
    # target value is always relative to it and is resolved again per operation.
    client-path: ${SQLITE_PATH:/usr/bin/sqlite3}
    root: ${SQLITE_ROOT:./sqlite}
    connect-timeout: 10s

  oracle:
    # Oracle Instant Client is deliberately an optional pack. The base image
    # has no Oracle binaries and therefore keeps this off.
    enabled: ${ORACLE_ENABLED:false}
    sqlplus-path: ${ORACLE_SQLPLUS_PATH:/opt/oracle/instantclient/sqlplus}
    export-path: ${ORACLE_EXPDP_PATH:/opt/oracle/instantclient/expdp}
    import-path: ${ORACLE_IMPDP_PATH:/opt/oracle/instantclient/impdp}
    # The application-side mount of the same storage named by each target's
    # Oracle directory object.
    data-pump-root: ${ORACLE_DATAPUMP_ROOT:./oracle-datapump}
    connect-timeout: ${ORACLE_CONNECT_TIMEOUT:30s}

  sqlserver:
    # SQL Server support is an optional pack. The example image supplies both
    # SqlPackage (BACPAC export/import) and sqlcmd (the lightweight probe).
    enabled: ${SQLSERVER_ENABLED:false}
    sqlpackage-path: ${SQLPACKAGE_PATH:/opt/sqlpackage/sqlpackage}
    sqlcmd-path: ${SQLCMD_PATH:/opt/mssql-tools18/bin/sqlcmd}
    connect-timeout: ${SQLSERVER_CONNECT_TIMEOUT:10s}
    # Encryption is always requested. Keep certificate validation on unless an
    # internal/self-signed deployment explicitly accepts the weaker setting.
    trust-server-certificate: ${SQLSERVER_TRUST_SERVER_CERTIFICATE:false}
    # SqlPackage buffers uncompressed table data. The image variant puts this
    # on the backup volume rather than its smaller writable container layer.
    temp-directory: ${SQLSERVER_TEMP_DIR:./sqlserver-temp}

  jobs:
    # How many backups and restores may run at once, together. Each is a child
    # process competing for the same disk, so more is not faster.
    concurrency: ${JOB_CONCURRENCY:2}
    # Beyond this the pool refuses the work and the execution is recorded as
    # failed, rather than the queue growing without limit.
    queue-capacity: ${JOB_QUEUE_CAPACITY:20}

  backup:
    # Backstop for a dump that hangs; the child is killed after this.
    timeout: ${BACKUP_TIMEOUT:30m}

  restore:
    # Loading a large dump is slower than producing it: the server is executing
    # every statement, not just reading pages.
    timeout: ${RESTORE_TIMEOUT:60m}

  verification:
    # Opt-in because the network-engine adapters control throwaway containers
    # through the host Docker socket. SQLite uses the same switch for one
    # predictable operator control, although it needs no socket itself.
    enabled: ${DBBACKUP_VERIFICATION_ENABLED:false}
    mysql-image: ${DBBACKUP_VERIFICATION_MYSQL_IMAGE:mysql:8.4}
    mariadb-image: ${DBBACKUP_VERIFICATION_MARIADB_IMAGE:mariadb:10.11}
    postgresql-image: ${DBBACKUP_VERIFICATION_POSTGRESQL_IMAGE:postgres:17-alpine}
    mongodb-image: ${DBBACKUP_VERIFICATION_MONGODB_IMAGE:mongo:8.0}
    oracle-image: ${DBBACKUP_VERIFICATION_ORACLE_IMAGE:gvenzl/oracle-free:23-slim-faststart}
    sqlserver-image: ${DBBACKUP_VERIFICATION_SQLSERVER_IMAGE:dbbackup-verification-sqlserver:2022}
    pull-timeout: ${DBBACKUP_VERIFICATION_PULL_TIMEOUT:10m}
    startup-timeout: ${DBBACKUP_VERIFICATION_STARTUP_TIMEOUT:2m}
    # Oracle and SQL Server need longer than the smaller community images to
    # initialise their first disposable instance.
    oracle-startup-timeout: ${DBBACKUP_VERIFICATION_ORACLE_STARTUP_TIMEOUT:10m}
    sqlserver-startup-timeout: ${DBBACKUP_VERIFICATION_SQLSERVER_STARTUP_TIMEOUT:5m}
    cleanup-timeout: ${DBBACKUP_VERIFICATION_CLEANUP_TIMEOUT:30s}

  storage:
    local:
      root: ${BACKUP_DIR:./backups}
    staging:
      # One private directory per backup/restore operation. Remote artifacts
      # are removed from here after upload or restore, including failures.
      root: ${STORAGE_STAGING_DIR:${BACKUP_DIR:./backups}/.staging}

  encryption:
    # 32 bytes, Base64 encoded: openssl rand -base64 32
    # No default. Starting without it must fail loudly rather than silently
    # protect stored passwords with a key everyone knows.
    key: ${ENCRYPTION_SECRET_KEY:}

server:
  servlet:
    session:
      # Cookie only. Without this Tomcat falls back to rewriting URLs with
      # ;jsessionid= for the first request of a session, which puts the session
      # identifier into browser history, logs and Referer headers.
      tracking-modes: cookie

spring:
  application:
    name: database-backup-utility

  # PostgreSQL is where this tool keeps its own metadata. It is not, and is not
  # yet, an engine that can be backed up — see docs/architecture/overview.md.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbbackup}
    username: ${DB_USERNAME:dbbackup}
    password: ${DB_PASSWORD:dbbackup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the mapping still
      # matches it, and refuses to start when a migration is missing.
      ddl-auto: validate

dbbackup:
  mysql:
    # The tool drives the MySQL client binaries directly. A wrong path here
    # stops startup rather than surfacing later as a puzzling connection
    # failure.
    client-path: ${MYSQL_CLIENT_PATH:/usr/bin/mysql}
    dump-path: ${MYSQLDUMP_PATH:/usr/bin/mysqldump}
    # Passed to the clients as --connect-timeout, so an unreachable host fails
    # in seconds instead of holding the request open.
    connect-timeout: 10s

  backup:
    # How many dumps may run at once. Each is a child process competing for the
    # same disk, so more is not faster.
    concurrency: ${BACKUP_CONCURRENCY:2}
    # Beyond this the pool refuses the work and the execution is recorded as
    # failed, rather than the queue growing without limit.
    queue-capacity: ${BACKUP_QUEUE_CAPACITY:20}
    # Backstop for a dump that hangs; the child is killed after this.
    timeout: ${BACKUP_TIMEOUT:30m}

  storage:
    local:
      root: ${BACKUP_DIR:./backups}

  encryption:
    # 32 bytes, Base64 encoded: openssl rand -base64 32
    # No default. Starting without it must fail loudly rather than silently
    # protect stored passwords with a key everyone knows.
    key: ${ENCRYPTION_SECRET_KEY:}

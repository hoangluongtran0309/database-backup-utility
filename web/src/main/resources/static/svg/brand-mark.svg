<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="dbBrandMarkTitle">
    <title id="dbBrandMarkTitle">DB Backup Utility</title>
    <!--
      The letters are Inter — the same typeface app.css loads for the UI —
      converted to outlines. Outlines, not <text>, because this file is also the
      source favicon.ico is rasterised from and <text> would render with whatever
      font the build machine happens to have.

      Generated from static/fonts/inter-latin-wght-normal.woff2 at wght=750
      (the weight .brand uses), cap height 21 in the 48-unit tile, letter
      spacing -80 font units, pair centred on the tile. Re-derive with
      fontTools if the font or the weight ever changes.
    -->
    <defs>
        <linearGradient id="dbBrandMarkGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3d8ef0"/>
            <stop offset="1" stop-color="#7d63f5"/>
        </linearGradient>
    </defs>
    <rect width="48" height="48" rx="14" fill="url(#dbBrandMarkGradient)"/>

<div xmlns:th="http://www.thymeleaf.org">
  <span th:fragment="statusBadge(status)"
        class="badge"
        th:classappend="${status.name() == 'SUCCEEDED' ? 'ok'
                        : (status.name() == 'FAILED' ? 'failed' : 'running')}"
        th:text="${#strings.capitalize(#strings.toLowerCase(status))}">Running</span>
</div>

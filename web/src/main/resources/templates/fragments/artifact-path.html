<!--
  Where an artifact lives: its file name first — what the operator recognises,
  and what a download is saved as — with the directory beneath it, which is
  only needed to find the file on the server.

  The fragment is the <dd> itself, used with th:replace, so the caller's grid
  cell is this element and not a wrapper around it.

  Plain String methods rather than java.nio.file.Path: Thymeleaf 3.1 refuses
  static calls into java.nio from a template. Artifact paths are always
  absolute and '/'-separated — the application only runs where the MySQL
  client lives, which is Linux.
-->
<dl xmlns:th="http://www.thymeleaf.org">
  <dd th:fragment="artifactPath(path)">
    <th:block th:if="${path == null}">—</th:block>
    <div class="cell-stack" th:unless="${path == null}">
      <span class="mono break"
            th:text="${path.substring(path.lastIndexOf('/') + 1)}">shop_20260909_100000.sql.gz</span>
      <span class="field-hint" th:if="${path.lastIndexOf('/') > 0}">in <span class="mono break"
            th:text="${path.substring(0, path.lastIndexOf('/'))}">/var/lib/dbbackup/backups</span></span>
    </div>
  </dd>
</dl>

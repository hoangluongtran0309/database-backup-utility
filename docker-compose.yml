# Everything needed to run this tool: the application, and the PostgreSQL it
# keeps its own metadata in. Nothing on the host but Docker.
#
#   echo "ENCRYPTION_SECRET_KEY=$(openssl rand -base64 32)" > .env
#   docker run --rm -it httpd:2.4-alpine htpasswd -nBC 12 ""
#     (type the console password twice; it prints ":$2y$12$…")
#   echo "OPERATOR_PASSWORD_HASH='\$2y\$12\$…'" >> .env
#     (the printed hash without its leading colon, in single quotes —
#      unquoted, compose reads every $ in it as the start of a variable)
#   docker compose up --build
#   printf '%s\n' "$DBBACKUP_API_PASSWORD" | docker compose exec -T app \
#     dbbackup target list --password-stdin
#
# For local development against a Maven-run application, `docker compose up -d
# postgres` starts just the metadata store.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dbbackup-postgres
    environment:
      POSTGRES_DB: dbbackup
      POSTGRES_USER: dbbackup
      POSTGRES_PASSWORD: dbbackup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbbackup -d dbbackup"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: dbbackup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dbbackup
      DB_USERNAME: dbbackup
      DB_PASSWORD: dbbackup
      # No default. Starting without it fails loudly, which is the right
      # outcome: a default key would mean every stored password is protected by
      # a secret published in this repository.
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      # The one account that can sign in to the console. The hash likewise has
      # no default: without it the application refuses to start. See ADR-011.
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-admin}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH}
      SQLITE_ROOT: /var/lib/dbbackup/sqlite
      BACKUP_DIR: /var/lib/dbbackup/backups
      STORAGE_STAGING_DIR: /var/lib/dbbackup/backups/.staging
      # Optional Azure Default Credential inputs. Managed identity needs none
      # of the tenant/secret values; AZURE_CLIENT_ID may select a user-assigned identity.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TOKEN_CREDENTIALS: ${AZURE_TOKEN_CREDENTIALS:-}
      # Optional deployment-wide transport for Email notification channels.
      DBBACKUP_SMTP_HOST: ${DBBACKUP_SMTP_HOST:-}
      DBBACKUP_SMTP_PORT: ${DBBACKUP_SMTP_PORT:-587}
      DBBACKUP_SMTP_USERNAME: ${DBBACKUP_SMTP_USERNAME:-}
      DBBACKUP_SMTP_PASSWORD: ${DBBACKUP_SMTP_PASSWORD:-}
      DBBACKUP_SMTP_FROM: ${DBBACKUP_SMTP_FROM:-dbbackup@localhost}
      DBBACKUP_SMTP_AUTH: ${DBBACKUP_SMTP_AUTH:-true}
      DBBACKUP_SMTP_STARTTLS: ${DBBACKUP_SMTP_STARTTLS:-true}
      # Restore verification stays off unless the operator deliberately enables
      # it and grants Docker-socket access below.
      DBBACKUP_VERIFICATION_ENABLED: ${DBBACKUP_VERIFICATION_ENABLED:-false}
      DBBACKUP_VERIFICATION_MYSQL_IMAGE: ${DBBACKUP_VERIFICATION_MYSQL_IMAGE:-mysql:8.4}
      DBBACKUP_VERIFICATION_MARIADB_IMAGE: ${DBBACKUP_VERIFICATION_MARIADB_IMAGE:-mariadb:10.11}
      DBBACKUP_VERIFICATION_POSTGRESQL_IMAGE: ${DBBACKUP_VERIFICATION_POSTGRESQL_IMAGE:-postgres:17-alpine}
      DBBACKUP_VERIFICATION_MONGODB_IMAGE: ${DBBACKUP_VERIFICATION_MONGODB_IMAGE:-mongo:8.0}
      DBBACKUP_VERIFICATION_ORACLE_IMAGE: ${DBBACKUP_VERIFICATION_ORACLE_IMAGE:-gvenzl/oracle-free:23-slim-faststart}
      DBBACKUP_VERIFICATION_SQLSERVER_IMAGE: ${DBBACKUP_VERIFICATION_SQLSERVER_IMAGE:-dbbackup-verification-sqlserver:2022}
      DBBACKUP_VERIFICATION_PULL_TIMEOUT: ${DBBACKUP_VERIFICATION_PULL_TIMEOUT:-10m}
      DBBACKUP_VERIFICATION_STARTUP_TIMEOUT: ${DBBACKUP_VERIFICATION_STARTUP_TIMEOUT:-2m}
      DBBACKUP_VERIFICATION_ORACLE_STARTUP_TIMEOUT: ${DBBACKUP_VERIFICATION_ORACLE_STARTUP_TIMEOUT:-10m}
      DBBACKUP_VERIFICATION_SQLSERVER_STARTUP_TIMEOUT: ${DBBACKUP_VERIFICATION_SQLSERVER_STARTUP_TIMEOUT:-5m}
      DBBACKUP_VERIFICATION_CLEANUP_TIMEOUT: ${DBBACKUP_VERIFICATION_CLEANUP_TIMEOUT:-30s}
    ports:
      - "8080:8080"
    volumes:
      # Named, not bind-mounted: the artifacts outlive the container, and
      # nothing about them belongs in the source tree.
      - backups:/var/lib/dbbackup/backups
      # Put SQLite files in ./sqlite (or set SQLITE_HOST_DIR). The files stay
      # outside the image and may be shared with the application that owns them.
      - ${SQLITE_HOST_DIR:-./sqlite}:/var/lib/dbbackup/sqlite
      # Opt-in restore verification for network engines. docker.sock grants
      # root-equivalent control of the host. Uncomment this and group_add only
      # after accepting that boundary; set DOCKER_SOCKET_GID to
      # `stat -c '%g' /var/run/docker.sock` on the host.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_SOCKET_GID:-999}"
    # A target database running on the host is reachable as
    # host.docker.internal from inside this container. On Linux that name does
    # not exist without this line; on Docker Desktop it is harmless.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  backups:

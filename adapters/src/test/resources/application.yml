# The datasource is supplied per test class from the Testcontainers instance.
dbbackup:
  mysql:
    client-path: ${MYSQL_CLIENT_PATH:/usr/bin/mysql}
    dump-path: ${MYSQLDUMP_PATH:/usr/bin/mysqldump}
    connect-timeout: 10s

  postgresql:
    psql-path: ${PSQL_PATH:/usr/bin/psql}
    dump-path: ${PG_DUMP_PATH:/usr/bin/pg_dump}
    restore-path: ${PG_RESTORE_PATH:/usr/bin/pg_restore}
    connect-timeout: 10s

  mongodb:
    dump-path: ${MONGODUMP_PATH:/usr/bin/mongodump}
    restore-path: ${MONGORESTORE_PATH:/usr/bin/mongorestore}
    connect-timeout: 10s

  backup:
    timeout: 5m

  restore:
    timeout: 5m

  storage:
    local:
      root: ${java.io.tmpdir}/dbbackup-it

  encryption:
    key: ZGJiYWNrdXAtaW50ZWdyYXRpb24tdGVzdC1rZXktMzI=

logging:
  level:
    org.hibernate.SQL: warn

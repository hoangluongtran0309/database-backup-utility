vulnerabilities:
  # These findings originate in Go binaries shipped by Microsoft's current
  # SQL Server 2022 base image. This project cannot rebuild those binaries and
  # does not publish the derived verification image. Re-evaluate the upstream
  # image before this temporary exception expires.
  - id: CVE-2026-27145
    paths: &sqlserver_upstream_go_binaries
      - opt/mssql/bin/launchpadd
      - opt/mssql/bin/setnetbr
      - opt/mssql-extensibility/bin/launchpad
    statement: Microsoft SQL Server 2022 upstream Go binary; monitor the base image for a patched rebuild.
    expired_at: 2026-12-15

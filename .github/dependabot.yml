version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    groups:
      maven-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: Asia/Ho_Chi_Minh
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Ho_Chi_Minh
    groups:
      docker-images:
        patterns: ['*']
    open-pull-requests-limit: 10

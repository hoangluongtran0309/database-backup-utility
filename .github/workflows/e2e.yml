name: E2E

on:
  push:
    branches: [main, develop, 'release/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-cli-e2e:
    name: API and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the release-shaped image
        run: docker build -t dbbackup-e2e:${{ github.sha }} .

      - name: Exercise the API through the bundled CLI
        env:
          DBBACKUP_E2E_IMAGE: dbbackup-e2e:${{ github.sha }}
          DBBACKUP_E2E_LOG_DIR: ${{ runner.temp }}/dbbackup-e2e-logs
        run: .github/e2e/run.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/dbbackup-e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

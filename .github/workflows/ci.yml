name: CI

on:
  push:
    # Every branch GitFlow merges from, so a release branch is already proven
    # before it reaches main. feature/* is covered by its pull request.
    branches: [main, develop, 'release/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  # Re-run the build without inventing a commit to push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests run against real containers. Nothing in this build is
      # allowed to skip itself when a dependency is missing: a test that turns
      # green by not running is worse than no test, so anything an IT needs is
      # installed here and its absence must fail the job.
      # The application drives these binaries directly, and the integration
      # tests run them against a real server. Asserted here rather than assumed:
      # the predecessor of this project had a MongoDB test that skipped itself
      # for its entire life because CI never installed the tools it needed.
      - name: Install the database client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools mysql-client postgresql-client sqlite3
          test -x /usr/bin/mysql
          test -x /usr/bin/mysqldump
          test -x /usr/bin/psql
          test -x /usr/bin/pg_dump
          test -x /usr/bin/pg_restore
          test -x /usr/bin/mongodump
          test -x /usr/bin/mongorestore
          test -x /usr/bin/sqlite3

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build base and Oracle example images
        run: |
          docker build -t dbbackup-ci:base .
          mkdir -p .oracle-client-fixture
          for client in sqlplus expdp impdp; do
            printf '#!/bin/sh\nexit 0\n' > ".oracle-client-fixture/$client"
            chmod 755 ".oracle-client-fixture/$client"
          done
          docker build -f Dockerfile.oracle.example \
            --build-arg BASE_IMAGE=dbbackup-ci:base \
            --build-arg ORACLE_CLIENT_DIR=.oracle-client-fixture \
            -t dbbackup-ci:oracle .

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: go install github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_COMMIT}"

      - name: Lint workflows and embedded shell
        run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck shellcheck

      - name: Validate vulnerability suppressions
        run: ruby .github/scripts/validate-trivy-ignore.rb

  maven-verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MYSQL_CLIENT_PATH: /opt/mysql/bin/mysql
      MYSQLDUMP_PATH: /opt/mysql/bin/mysqldump
      MARIADB_CLIENT_PATH: /usr/bin/mariadb
      MARIADB_DUMP_PATH: /usr/bin/mariadb-dump
      PSQL_PATH: /usr/lib/postgresql/17/bin/psql
      PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
      PG_RESTORE_PATH: /usr/lib/postgresql/17/bin/pg_restore
      SQLPACKAGE_PATH: /home/runner/.dotnet/tools/sqlpackage
      SQLCMD_PATH: /opt/mssql-tools18/bin/sqlcmd

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install SqlPackage 170.5.96
        run: |
          dotnet tool install --global Microsoft.SqlPackage --version 170.5.96
          test -x "$SQLPACKAGE_PATH"
          "$SQLPACKAGE_PATH" /Version

      # No integration test may turn green by skipping itself. Every binary
      # used by a real-engine IT is installed and asserted here.
      - name: Install database client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          curl -fsSLo /tmp/packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y \
            mongodb-database-tools mysql-client postgresql-client-17 sqlite3 mssql-tools18
          sudo install -D -m 0755 /usr/bin/mysql /opt/mysql/bin/mysql
          sudo install -D -m 0755 /usr/bin/mysqldump /opt/mysql/bin/mysqldump
          sudo apt-get install -y mariadb-client
          test -x /opt/mysql/bin/mysql
          test -x /opt/mysql/bin/mysqldump
          test -x /usr/bin/mariadb
          test -x /usr/bin/mariadb-dump
          test -x "$PSQL_PATH"
          test -x "$PG_DUMP_PATH"
          test -x "$PG_RESTORE_PATH"
          "$PSQL_PATH" --version | grep -E '^psql \(PostgreSQL\) 17\.'
          "$PG_DUMP_PATH" --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          "$PG_RESTORE_PATH" --version | grep -E '^pg_restore \(PostgreSQL\) 17\.'
          test -x /usr/bin/mongodump
          test -x /usr/bin/mongorestore
          test -x /usr/bin/sqlite3
          test -x "$SQLCMD_PATH"

      - name: Build the SQL Server verification runtime required by integration tests
        run: |
          docker build -f Dockerfile.sqlserver-verification.example \
            -t dbbackup-verification-sqlserver:2022 .
          docker run --rm --entrypoint /opt/sqlpackage/sqlpackage \
            dbbackup-verification-sqlserver:2022 /Version
          docker run --rm --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            dbbackup-verification-sqlserver:2022 -?

      - name: Verify every Maven module
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  container-build-and-scan:
    name: Container build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke-test SQL Server verification image
        run: |
          docker build -f Dockerfile.sqlserver-verification.example \
            -t dbbackup-ci:sqlserver-verification .
          docker run --rm --entrypoint /opt/sqlpackage/sqlpackage \
            dbbackup-ci:sqlserver-verification /Version
          docker run --rm --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            dbbackup-ci:sqlserver-verification -?

      - name: Build base and optional application images
        run: |
          docker build -t dbbackup-ci:base .
          for client in psql pg_dump pg_restore; do
            docker run --rm --entrypoint "/usr/lib/postgresql/17/bin/$client" \
              dbbackup-ci:base --version | grep -E "^$client \\(PostgreSQL\\) 17\\."
          done
          mkdir -p .oracle-client-fixture
          printf '%s\n' 'int oracle_fixture(void) { return 0; }' > /tmp/oracle-fixture-library.c
          printf '%s\n' \
            'extern int oracle_fixture(void);' \
            'int main(void) { return oracle_fixture(); }' \
            > /tmp/oracle-fixture-client.c
          cc -shared -fPIC -Wl,-soname,liboraclefixture.so \
            -o .oracle-client-fixture/liboraclefixture.so /tmp/oracle-fixture-library.c
          for client in sqlplus expdp impdp; do
            cc -o ".oracle-client-fixture/$client" /tmp/oracle-fixture-client.c \
              -L.oracle-client-fixture -Wl,--no-as-needed -loraclefixture
            ! readelf -d ".oracle-client-fixture/$client" | grep -Eq 'RPATH|RUNPATH'
            ldd ".oracle-client-fixture/$client" | grep -F 'liboraclefixture.so => not found'
          done
          docker build -f Dockerfile.oracle.example \
            --build-arg BASE_IMAGE=dbbackup-ci:base \
            --build-arg ORACLE_CLIENT_DIR=.oracle-client-fixture \
            -t dbbackup-ci:oracle .
          docker run --rm --entrypoint /bin/sh dbbackup-ci:oracle -c \
            'test -L /usr/lib/x86_64-linux-gnu/libaio.so.1 && test -e /usr/lib/x86_64-linux-gnu/libaio.so.1'
          for client in sqlplus expdp impdp; do
            docker run --rm --entrypoint "/opt/oracle/instantclient/$client" dbbackup-ci:oracle
          done
          docker build -f Dockerfile.sqlserver.example \
            --build-arg BASE_IMAGE=dbbackup-ci:base \
            -t dbbackup-ci:sqlserver .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Generate SARIF reports
        run: |
          mkdir -p trivy-results
          for entry in \
            base=dbbackup-ci:base \
            oracle=dbbackup-ci:oracle \
            sqlserver=dbbackup-ci:sqlserver \
            sqlserver-verification=dbbackup-ci:sqlserver-verification; do
            name="${entry%%=*}"
            image="${entry#*=}"
            trivy image --scanners vuln --ignorefile .trivyignore.yaml \
              --ignore-unfixed --severity HIGH,CRITICAL \
              --format sarif --output "trivy-results/${name}.sarif" "$image"
          done

      - name: Upload base-image Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: trivy-results/base.sarif
          category: container-base

      - name: Upload Oracle-image Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: trivy-results/oracle.sarif
          category: container-oracle

      - name: Upload SQL Server-image Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: trivy-results/sqlserver.sarif
          category: container-sqlserver

      - name: Upload SQL Server verification-image Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: trivy-results/sqlserver-verification.sarif
          category: container-sqlserver-verification

      - name: Enforce the vulnerability policy
        run: |
          status=0
          for image in \
            dbbackup-ci:base \
            dbbackup-ci:oracle \
            dbbackup-ci:sqlserver \
            dbbackup-ci:sqlserver-verification; do
            trivy image --scanners vuln --ignorefile .trivyignore.yaml \
              --ignore-unfixed --severity HIGH,CRITICAL \
              --format table --exit-code 1 "$image" || status=1
          done
          exit "$status"

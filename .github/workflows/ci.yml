name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests run against real containers. Nothing in this build is
      # allowed to skip itself when a dependency is missing: a test that turns
      # green by not running is worse than no test, so anything an IT needs is
      # installed here and its absence must fail the job.
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
